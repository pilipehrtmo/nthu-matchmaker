# Render Blueprint for NTHU Matchmaker.
# New service: New -> Blueprint -> pick this repo -> fill in the values Render asks for -> Apply.
# Values marked "sync: false" are set (and later changed) only in the Render dashboard, so a deploy never overwrites them.
# Never write a secret in this file: it is in the public GitHub repository.
services:
  - type: web
    name: nthu-matchmaker
    runtime: python
    plan: free
    region: virginia            # close to the Supabase database (us-east-1)
    buildCommand: pip install -r requirements.txt   # exact versions, tested on the Python version below
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips "*"
    healthCheckPath: /healthz   # tiny page: no database, no login, no cookie
    envVars:
      - key: PYTHON_VERSION     # keep in step with .python-version and requirements.txt
        value: 3.11.9
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: SECRET_KEY         # signs the login cookie; Render makes a random one
        generateValue: true
      - key: DB_URL             # Supabase session pooler connection string (secret)
        sync: false
      - key: BASE_URL           # https://nthu-matchmaker.onrender.com
        sync: false
      - key: ADMIN_EMAILS       # comma-separated; these accounts become admins when they log in (currently the team account only)
        sync: false
      - key: BREVO_API_KEY      # email over HTTPS (Render's free plan blocks SMTP) (secret)
        sync: false
      - key: MAIL_FROM          # sender address verified in Brevo
        sync: false
      - key: CONTACT_EMAIL      # shown on the admin's public page for reports and complaints
        sync: false
      - key: MATCH_MODE         # tags (live) | hybrid | embeddings; anything but tags falls back to tags if the model can't load
        sync: false
# Optional settings the app understands (leave unset for the defaults):
#   REQUIRE_EMAIL_VERIFY=auto (verify when email can be sent) | 1 | 0
#   KEEP_AWAKE=1 (ping itself every 10 minutes while public) | 0
#   STUDENT_EMAIL_RULE=any | nthu,   LOG_RETENTION_DAYS=180,   NTHU_PAGES
#   Research file storage: SUPABASE_URL, SUPABASE_SERVICE_KEY (secret), STORAGE_BUCKET, STORAGE_CAP_MB
#   Never on a public server: SHOW_LINK, DEMO_DATA (local demos only)
# No longer used on Render: SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASS, SMTP_FROM (Gmail SMTP; kept in the code for local use only).
