{% extends "base.html" %}{% block body %}<section class="card errpage"><h1>{{ title }}</h1><p>{{ msg }}</p>
{% if pending %}<form method="post" action="/verify/resend" class="acts" style="justify-content:center"><input type="hidden" name="csrf" value="{{ csrf }}"><button class="ghost">Send the link again</button><a class="btn" href="/login">Back to log in</a></form>
{% elif show_login %}<p class="acts"><a class="btn" href="/login">Go to log in</a></p>{% endif %}</section>{% endblock %}
