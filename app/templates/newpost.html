{% extends "base.html" %}{% block body %}<h1>New post</h1>
{% if error %}<p class="err">{{ error }}</p>{% endif %}
<form method="post" class="card"><input type="hidden" name="csrf" value="{{ csrf }}">
<label for="tp">Topic</label><select id="tp" name="topic">{% for t in topics %}<option {{ "selected" if t == sel }}>{{ t }}</option>{% endfor %}</select>
<label for="ti">Title</label><input id="ti" name="title" required maxlength="150" placeholder="A clear question or idea">
<label for="bo">Details (optional)</label><textarea id="bo" name="body" rows="6" maxlength="3000"></textarea>
<p class="muted">Be kind. Posts show your full name. Admins can remove posts that break the rules.</p>
<p><button>Post</button> <a href="/discuss">Cancel</a></p></form>{% endblock %}
