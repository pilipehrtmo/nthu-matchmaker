<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NTHU Matchmaker</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Instrument+Sans&display=swap">
<link rel="stylesheet" href="/static/style.css"><script src="https://unpkg.com/htmx.org@1.9.12"></script><script>document.documentElement.classList.add("js")</script><script src="/static/app.js" defer></script></head><body>
<header class="top"><nav><b><a href="/" style="text-decoration:none">NTHU Matchmaker</a></b>
<a href="/discuss">Discuss</a>
{% if user %}<a href="/projects/new">Post a project</a><a href="/profile">{{ user.handle }}</a>
{% if user.is_admin %}<a href="/admin">Admin</a>{% endif %}
<form method="post" action="/logout"><input type="hidden" name="csrf" value="{{ csrf }}"><button class="ghost">Log out</button></form>{% else %}<a href="/login">Log in</a>{% endif %}</nav></header>
<main>{% block body %}{% endblock %}</main><footer class="muted" style="text-align:center;padding:2rem"><a href="/privacy">Privacy notice</a></footer></body></html>
